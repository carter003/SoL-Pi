name: sol-omp checks
on:
  pull_request:
    paths: ["sol-omp/**", ".github/workflows/sol-omp-check.yml"]
  push:
    branches: [main]
    paths: ["sol-omp/**", ".github/workflows/sol-omp-check.yml"]
permissions:
  contents: read
concurrency:
  group: sol-omp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sol-omp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - run: node --experimental-strip-types --test tests/*.test.ts
  omp-runtime:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sol-omp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install candidate host
        id: install
        run: |
          mkdir -p smoke-results
          set -o pipefail
          bun --version | tee smoke-results/bun-version.log
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile 2>&1 | tee smoke-results/install.log
          else
            bun install 2>&1 | tee smoke-results/install.log
          fi
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee smoke-results/typecheck.log
      - name: Bun unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          bun test 2>&1 | tee smoke-results/tests.log
      - name: Real OMP load and shutdown (no model)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -o pipefail
          bun run smoke 2>&1 | tee smoke-results/smoke.log
      - name: Retain diagnostics and generated dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-omp-checks-${{ github.sha }}
          path: |
            sol-omp/smoke-results/
            sol-omp/bun.lock
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish bounded verification report
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- sol-omp-verification -->';
            const files = ['bun-version.log', 'install.log', 'typecheck.log', 'tests.log', 'smoke.log'];
            const sections = files.map(name => {
              const path = `sol-omp/smoke-results/${name}`;
              if (!fs.existsSync(path)) return `### ${name}\nNOT_RUN`;
              const text = fs.readFileSync(path, 'utf8');
              const bounded = text.length > 14000 ? text.slice(0, 9000) + '\n[truncated; full log in Actions artifact]\n' + text.slice(-5000) : text;
              return `### ${name}\n\n~~~text\n${bounded.replaceAll('~~~', '~~ ~')}\n~~~`;
            });
            const body = `${marker}\n## sol-omp CI verification\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThis is a real runner report, not MODEL_E2E.\n\n${sections.join('\n\n')}`;
            const args = {...context.repo, issue_number: context.issue.number};
            const {data} = await github.rest.issues.listComments({...args, per_page: 100});
            const old = data.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (old) await github.rest.issues.updateComment({...context.repo, comment_id: old.id, body});
            else await github.rest.issues.createComment({...args, body});
